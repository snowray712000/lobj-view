[package]
name = "lobj-view"
version = "1.6.2"
edition = "2024"
description = "Web-based viewer for .lobj (labeled binary 3D object) files"
# cargo install / cargo package ?芸葆??瑼?嚗eb/dist 敹?鈭? build 憟賭蒂銝韏瑞雿?
# 摰?蝡臬停銝?閬?Node.js??include = ["src/**", "build.rs", "assets/lobj-view.ico", "web/dist/**", "Cargo.toml", "README.md", "doc/Versions.md"]
readme = "README.md"
repository = "https://github.com/snowray712000/lobj-view"

# cargo binstall嚗?乩?頛?GitHub Release ??蝺刻陌瑼?瑼?閬?閬?.github/workflows/release.yml嚗?[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-ring"] }
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7"
# .lobj 霈撖怎??梁 crate嚗?皞 GitHub嚗璈??潛銝惜 ../.cargo/config.toml ??[patch] ?寧 ../lobj嚗府瑼??亦??改?
lobj = { git = "https://github.com/snowray712000/lobj", tag = "v1.1.1" }
local-ip-address = "0.6"
mime_guess = "2.0.5"
rcgen = "0.14.10"
rust-embed = "8.14.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
time = "0.3"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
open = "5"
serde_json = "1.0.154"
zip = { version = "9.7.3", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1"
