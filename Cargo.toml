[package]
name = "lobj-view"
version = "0.0.1"
edition = "2024"
description = "Web-based viewer for .lobj (labeled binary 3D object) files"
# cargo install / cargo package 只帶這些檔案；web/dist 必須事先 build 好並一起發佈，
# 安裝端就不需要 Node.js。
include = ["src/**", "web/dist/**", "Cargo.toml"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.8", features = ["derive"] }
mime_guess = "2.0.5"
rust-embed = "8.14.0"
tokio = { version = "1.54.1", features = ["full"] }
