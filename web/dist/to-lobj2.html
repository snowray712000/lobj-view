<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>批次轉 .lobj2</title>
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --mute:#6e6e73; --line:#d2d2d7; --acc:#0a64d8; --ok:#1a7f37; --bad:#c62828; --warn:#b26a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#f2f2f7; --mute:#9a9aa0; --line:#3a3a3c; --acc:#4c9bff; --ok:#4cc26a; --bad:#ff6b6b; --warn:#ffb347; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,sans-serif; }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.hint { color:var(--mute); margin:0 0 12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  input[type=text] { flex:1; min-width:200px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  button, select { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer; font:inherit; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .dirs { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .dirs button { font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); } .mute { color:var(--mute); }
  progress { width:100%; height:10px; }
  #msg { margin:8px 0; white-space:pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>批次轉 .lobj2</h1>
  <p class="hint">把資料夾裡的 .lobj 轉成同名 .lobj2。上 / 下顎由檔名（upper / lower）判斷；判斷不出來的請在該列手動指定。只在伺服器監聽本機位址時可用。<a href="/">回檢視器</a></p>
  <div class="row">
    <button id="up">↑ 上一層</button>
    <input type="text" id="path" placeholder="資料夾路徑（相對 --dir 或完整路徑），Enter 前往">
    <button id="go">前往</button>
  </div>
  <div class="dirs" id="dirs"></div>
  <table>
    <thead><tr><th><input type="checkbox" id="all"></th><th>檔名</th><th>上 / 下顎</th><th class="num">大小</th><th>狀態</th></tr></thead>
    <tbody id="files"></tbody>
  </table>
  <div class="row">
    <label><input type="checkbox" id="del"> 轉換成功後刪除原本的 .lobj</label>
  </div>
  <div class="row">
    <button class="primary" id="run">轉換勾選的檔案</button>
    <span id="count" class="mute"></span>
  </div>
  <progress id="bar" value="0" max="1" hidden></progress>
  <div id="msg"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let cur = { path: '', up: null, dirs: [], files: [] };
let rows = []; // { name, jaw, size, exists, state }
let busy = false;

const guessJaw = (n) => {
  const s = n.toLowerCase(), u = s.includes('upper'), l = s.includes('lower');
  return u && !l ? 'upper' : l && !u ? 'lower' : '';
};
const join = (dir, name) => (dir ? dir.replace(/[\\/]+$/, '') + '/' : '') + name;
const size = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB';
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function load(path) {
  $('msg').textContent = '';
  try {
    const r = await fetch('/api/lobj?path=' + encodeURIComponent(path));
    if (!r.ok) throw new Error(await r.text());
    cur = await r.json();
  } catch (e) { $('msg').innerHTML = '<span class="bad">' + esc(String(e.message || e)) + '</span>'; return; }
  $('path').value = cur.path;
  const names = new Set(cur.files.map((f) => f.name.toLowerCase()));
  rows = cur.files.filter((f) => /\.lobj$/i.test(f.name)).map((f) => ({
    name: f.name, size: f.size, jaw: guessJaw(f.name),
    exists: names.has(f.name.replace(/\.lobj$/i, '.lobj2').toLowerCase()), state: '', checked: false,
  }));
  rows.forEach((r) => { r.checked = !r.exists && !!r.jaw; });
  render();
}

function render() {
  $('dirs').innerHTML = '';
  for (const d of cur.dirs) {
    const b = document.createElement('button');
    b.textContent = '📁 ' + d;
    b.onclick = () => load(join(cur.path, d));
    $('dirs').append(b);
  }
  $('up').disabled = cur.up == null;
  const tb = $('files');
  tb.innerHTML = '';
  rows.forEach((r, i) => {
    const tr = document.createElement('tr');
    const st = r.state || (r.exists ? '<span class="warn">.lobj2 已存在</span>' : !r.jaw ? '<span class="warn">需指定上 / 下顎</span>' : '<span class="mute">待轉換</span>');
    tr.innerHTML = '<td><input type="checkbox" ' + (r.checked ? 'checked' : '') + (r.exists || busy ? ' disabled' : '') + '></td>' +
      '<td>' + esc(r.name) + '</td>' +
      '<td><select ' + (busy ? 'disabled' : '') + '><option value="">?</option><option value="upper">上顎</option><option value="lower">下顎</option></select></td>' +
      '<td class="num">' + size(r.size) + '</td><td>' + st + '</td>';
    tr.querySelector('select').value = r.jaw;
    tr.querySelector('select').onchange = (e) => { r.jaw = e.target.value; if (!r.jaw) r.checked = false; render(); };
    tr.querySelector('input').onchange = (e) => { r.checked = e.target.checked; count(); };
    tb.append(tr);
  });
  if (!rows.length) tb.innerHTML = '<tr><td colspan="5" class="mute">這個資料夾沒有 .lobj 檔</td></tr>';
  count();
}

function todo() { return rows.filter((r) => r.checked && r.jaw && !r.exists && r.state !== 'done'); }
function count() {
  $('count').textContent = '勾選 ' + todo().length + ' / ' + rows.length + ' 個';
  $('run').disabled = busy || !todo().length;
  $('all').checked = rows.length > 0 && rows.every((r) => r.exists || r.checked);
}

$('all').onchange = (e) => { rows.forEach((r) => { if (!r.exists && r.jaw) r.checked = e.target.checked; }); render(); };
$('go').onclick = () => load($('path').value.trim());
$('path').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
$('up').onclick = () => cur.up != null && load(cur.up);

$('run').onclick = async () => {
  const list = todo();
  if (!list.length) return;
  const del = $('del').checked;
  if (del && !confirm('轉換成功後會刪除 ' + list.length + ' 個原本的 .lobj，確定？')) return;
  busy = true; $('bar').hidden = false; $('bar').max = list.length; $('bar').value = 0;
  let ok = 0, fail = 0;
  for (const r of list) {
    r.state = '<span class="mute">轉換中…</span>'; render();
    try {
      const res = await fetch('/api/lobj-convert', {
        method: 'POST',
        headers: { 'X-Lobj-Requested': '1', 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: join(cur.path, r.name), jaw: r.jaw, delete_old: del }),
      });
      if (!res.ok) throw new Error(await res.text());
      r.state = '<span class="ok">✓ 已轉換' + (del ? '（已刪原檔）' : '') + '</span>'; r.exists = true; r.checked = false; ok++;
    } catch (e) { r.state = '<span class="bad">失敗：' + esc(String(e.message || e)) + '</span>'; fail++; }
    $('bar').value++;
    render();
  }
  busy = false;
  $('msg').textContent = '完成：成功 ' + ok + ' 個，失敗 ' + fail + ' 個';
  render();
};

load(new URLSearchParams(location.search).get('path') || '');
</script>
</body>
</html>
