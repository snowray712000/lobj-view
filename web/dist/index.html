<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lobj-view</title>
    <script type="module" crossorigin src="/assets/index-CFnu6rlm.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-OyM8NJvn.css">
  </head>
  <body>
    <div id="viewport"></div>
    <div id="hud">
      <div id="status" class="box">
        <b>lobj-view</b> @ccu-cadcam
        <button id="ver" type="button" title="查看版本紀錄">…</button>
        · server: <span id="health">…</span> · renderer: <span id="backend">…</span>
        <div id="status2">
          光源:
          <select id="light" title="固定：光源不隨視角；頭燈：光隨眼睛位置；三燈：頭燈加左右各一">
            <option value="fixed">固定</option>
            <option value="head">頭燈（跟隨眼睛）</option>
            <option value="three">三燈（眼睛＋左＋右）</option>
          </select>
          · <label><input id="grid-toggle" type="checkbox" /> 格線</label>
          · 主題:
          <select id="theme">
            <option value="">自動（系統）</option>
            <option value="light">淺色</option>
            <option value="dark">深色</option>
            <option value="hc-light">高對比淺色</option>
            <option value="hc-dark">高對比深色</option>
          </select>
        </div>
      </div>
      <div id="browser" class="box">
        <button id="browser-toggle" class="toggle" type="button" aria-expanded="true">選擇檔案</button>
        <div id="browser-body">
          <div>
            <input id="path" type="text" spellcheck="false" placeholder="貼上路徑後按 Enter（/ 或 \ 皆可）" />
            <select id="jaw" title="舊 .lobj 且檔名沒有 upper / lower 時使用">
              <option value="">jaw: 自動</option>
              <option value="upper">upper</option>
              <option value="lower">lower</option>
            </select>
          </div>
          <div class="hint">Ctrl/⌘ 點擊加選、Shift 點擊範圍選取</div>
          <ul id="files"></ul>
          <div id="info"></div>
        </div>
      </div>
    </div>
    <div id="versions" hidden>
      <div class="dlg-head"><b>Versions</b><label class="ver-detail"><input id="versions-detail" type="checkbox" /> 細節</label><button id="versions-close" type="button">✕</button></div>
      <div id="versions-body"></div>
    </div>
    <aside id="panel">
      <button id="panel-toggle" type="button" aria-expanded="true">物件 (0)</button>
      <div id="panel-body"></div>
    </aside>
  </body>
</html>
